<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sigma Graph Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #ffffff;
        }
        #sigma-container {
            width: 100%;
            height: 100%;
            display: block;
            position: relative;
        }
        #vg-debug {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ffe;
            color: #000;
            padding: 4px 8px;
            font: 11px monospace;
            z-index: 10001;
            border: 1px solid #c00;
            border-radius: 3px;
            max-width: 400px;
            white-space: pre-wrap;
            text-align: left;
            display: none;
        }
        #vg-error {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            padding: 8px 12px;
            background-color: #ffe6e6;
            border: 1px solid #c0392b;
            color: #c0392b;
            font-size: 13px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }
        #vg-tooltip {
            position: absolute;
            background: #ffffff;
            border: 1px solid #888;
            box-shadow: 1px 1px 4px rgba(0,0,0,0.25);
            padding: 0;
            font: 12px "Segoe UI", Arial, sans-serif;
            line-height: 1.3;
            border-radius: 4px;
            z-index: 99999;
            max-width: 340px;
            pointer-events: none;
            color: #222;
            display: none;
            overflow: hidden;
        }
        #vg-context-menu {
            position: absolute;
            background: #ffffff;
            border: 1px solid #cccccc;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 4px 0;
            font-size: 13px;
            display: none;
            z-index: 2000;
            min-width: 160px;
        }
        #vg-context-menu .vg-menu-item {
            padding: 4px 12px;
            cursor: pointer;
        }
        #vg-context-menu .vg-menu-item:hover {
            background: #f0f0f0;
        }
        #vg-context-menu .vg-menu-separator {
            border-top: 1px solid #dddddd;
            margin: 4px 0;
        }
        #vg-side-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5000;
            max-height: 80vh;
            max-width: 460px;
        }
        #vg-legend {
            position: relative;
            background: rgba(255,255,255,0.96);
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 8px 10px;
            font: 12px "Segoe UI", Arial, sans-serif;
            max-width: 280px;
            overflow-y: auto;
            box-shadow: 1px 2px 6px rgba(0,0,0,0.15);
            display: none;
            color: #222;
        }
        #vg-legend .vg-legend-header {
            font-weight: 600;
            padding-bottom: 4px;
            border-bottom: 1px solid #dddddd;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #vg-legend .vg-legend-toggle {
            cursor: pointer;
            color: #888;
            font-weight: normal;
            padding: 0 4px;
            user-select: none;
        }
        #vg-legend .vg-legend-toggle:hover {
            color: #333;
        }
        #vg-legend .vg-legend-body {
            display: block;
        }
        #vg-legend.vg-legend-collapsed .vg-legend-body {
            display: none;
        }
        #vg-legend .vg-legend-item {
            display: flex;
            align-items: center;
            padding: 3px 4px;
            cursor: pointer;
            border-radius: 3px;
            user-select: none;
        }
        #vg-legend .vg-legend-item:hover {
            background: #f0f0f0;
        }
        #vg-legend .vg-legend-item.vg-legend-active {
            background: #fff3cd;
            font-weight: 600;
        }
        #vg-legend .vg-legend-swatch {
            width: 14px;
            height: 14px;
            border: 1px solid #333;
            border-radius: 2px;
            margin-right: 6px;
            flex-shrink: 0;
        }
        #vg-legend .vg-legend-label {
            flex: 1;
            word-break: break-word;
        }
        #vg-legend .vg-legend-count {
            color: #777;
            font-size: 11px;
            margin-left: 6px;
        }
    </style>
</head>
<body>
<div id="sigma-container"></div>
<div id="vg-debug"></div>
<div id="vg-error"></div>
<div id="vg-tooltip"></div>
<div id="vg-context-menu"></div>
<div id="vg-side-panel">
    <div id="vg-legend" aria-label="Color legend">
        <div class="vg-legend-header">
            <span>Legend</span>
            <span class="vg-legend-toggle" title="Hide legend">&#x2212;</span>
        </div>
        <div class="vg-legend-body"></div>
    </div>
</div>

<!--
    Initial fetch URLs are inlined by SigmaViewer on the Java side BEFORE
    Browser.setText(...) so the iframe can start fetching as soon as it
    boots — no race with the Java-side applyData(...) call. Empty strings
    are fine: vg_loadGraph short-circuits and waits for a later push.
-->
<script>
window.__vg_initialNodesUrl = "__VG_INITIAL_NODES_URL__";
window.__vg_initialEdgesUrl = "__VG_INITIAL_EDGES_URL__";
</script>

<!--
    Load order matters: graphology first, then layout packages
    (forceatlas2, circular, random, noverlap), then sigma itself. The
    graphology-layout package exposes circular + random (no separate
    UMD bundles for those exist on npm); we expose
    graphologyLayoutForceAtlas2 and graphologyLayoutNoverlap as
    separate globals because their npm packages don't include a UMD
    build. build/iife.js bundles were generated locally via esbuild.
-->
<script src="/sigma/graphology.min.js"></script>
<script src="/sigma/graphology-layout.min.js"></script>
<script src="/sigma/graphology-layout-forceatlas2.min.js"></script>
<script src="/sigma/graphology-layout-noverlap.min.js"></script>
<script src="/sigma/sigma.min.js"></script>
<script src="/sigma/sigma-viewer.js"></script>
</body>
</html>
