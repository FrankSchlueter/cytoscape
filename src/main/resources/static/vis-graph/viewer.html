<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>vis-graph viewer</title>
    <link rel="stylesheet" href="/vis-network/vis-network.min.css">
    <link rel="stylesheet" href="/vis-graph/vis-graph-viewer.css">
    <script src="/vis-network/vis-network.min.js"></script>
</head>
<body>
    <div id="vgv-debug" style="position:absolute;top:4px;right:4px;background:lime;color:black;padding:2px 6px;font:11px monospace;z-index:10001;display:none">HTML loaded</div>
    <div id="network"></div>
    <div id="vgv-context-menu"></div>
    <div id="vgv-legend" aria-label="Color legend">
        <div class="vgv-legend-header">
            <span>Legend</span>
            <span class="vgv-legend-toggle" title="Hide legend">&#x2212;</span>
        </div>
        <div class="vgv-legend-body"></div>
        <div class="vgv-legend-hint" style="display:none"></div>
    </div>
    <script src="/vis-graph/vis-graph-viewer.js"></script>
</body>
</html>
