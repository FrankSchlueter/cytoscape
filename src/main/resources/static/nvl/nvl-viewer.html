<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>nvl-graph viewer</title>
    <link rel="stylesheet" href="/nvl/nvl-graph-viewer.css">
    <script src="/nvl/nvl-bundle.js"></script>
</head>
<body>
    <div id="vgv-debug" style="position:absolute;top:4px;right:4px;background:lime;color:black;padding:2px 6px;font:11px monospace;z-index:10001;display:none">HTML loaded</div>
    <div id="vgv-frame"></div>
    <div id="vgv-context-menu"></div>
    <div id="vgv-color-palette" aria-label="Color palette" style="display:none">
        <div class="vgv-palette-header">
            <span>Color Palette</span>
            <span class="vgv-palette-toggle" title="Hide palette">&#x2212;</span>
        </div>
        <div class="vgv-palette-body"></div>
    </div>
    <script src="/nvl/nvl-graph-viewer.js"></script>
</body>
</html>
