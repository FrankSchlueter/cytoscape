<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cytoscape Graph Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #ffffff;
        }
        #cy {
            width: 100%;
            height: 100%;
            display: block;
        }
        #error {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            padding: 8px 12px;
            background-color: #ffe6e6;
            border: 1px solid #c0392b;
            color: #c0392b;
            font-size: 13px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }
        #cgv-context-menu {
            position: absolute;
            background: #ffffff;
            border: 1px solid #cccccc;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 4px 0;
            font-size: 13px;
            display: none;
            z-index: 2000;
            min-width: 160px;
        }
        #cgv-context-menu .cgv-menu-item {
            padding: 4px 12px;
            cursor: pointer;
        }
        #cgv-context-menu .cgv-menu-item:hover {
            background: #f0f0f0;
        }
        #cgv-context-menu .cgv-menu-separator {
            border-top: 1px solid #dddddd;
            margin: 4px 0;
        }
        /* ----- Side panel: stacked legend + cluster edges table ----- */
        #cgv-side-panel {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5000;
            max-height: 80vh;
            max-width: 460px;
        }
        #cgv-legend {
            position: relative;
            background: rgba(255,255,255,0.96);
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 8px 10px;
            font: 12px "Segoe UI", Arial, sans-serif;
            max-width: 280px;
            overflow-y: auto;
            box-shadow: 1px 2px 6px rgba(0,0,0,0.15);
            display: none;
            color: #222;
        }
        #cgv-edges {
            position: relative;
            background: rgba(255,255,255,0.96);
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 8px 10px;
            font: 12px "Segoe UI", Arial, sans-serif;
            min-width: 260px;
            max-width: 440px;
            overflow-x: auto;
            box-shadow: 1px 2px 6px rgba(0,0,0,0.15);
            display: none;
            color: #222;
        }
        #cgv-edges .cgv-edges-header {
            font-weight: 600;
            padding-bottom: 4px;
            border-bottom: 1px solid #dddddd;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #cgv-edges .cgv-edges-toggle {
            cursor: pointer;
            color: #888;
            font-weight: normal;
            padding: 0 4px;
            user-select: none;
        }
        #cgv-edges .cgv-edges-toggle:hover {
            color: #333;
        }
        #cgv-edges .cgv-edges-empty {
            color: #999;
            font-style: italic;
            padding: 4px 0;
        }
        #cgv-edges table.cgv-edges-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        #cgv-edges table.cgv-edges-table th {
            background: #f4f4f4;
            text-align: left;
            padding: 4px 6px;
            border-bottom: 1px solid #cccccc;
            font-weight: 600;
        }
        #cgv-edges table.cgv-edges-table td {
            padding: 3px 6px;
            border-bottom: 1px solid #eeeeee;
            word-break: break-word;
        }
        #cgv-edges table.cgv-edges-table td.cgv-edge-weight {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        #cgv-edges table.cgv-edges-table tr.cgv-edge-intra td {
            background: rgba(255,255,255,0.6);
        }
        #cgv-edges table.cgv-edges-table tr.cgv-edge-bridge td {
            font-style: italic;
            color: #555555;
        }
        #cgv-edges table.cgv-edges-table tbody tr:hover td {
            background: #fff3cd;
            cursor: pointer;
        }
        /* ----- Community Overview edges table (shown when a community- */
        /*       node is selected in the aggregated root view)             */
        #cgv-community-edges {
            position: relative;
            background: rgba(255,255,255,0.96);
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 8px 10px;
            font: 12px "Segoe UI", Arial, sans-serif;
            min-width: 260px;
            max-width: 440px;
            max-height: 50vh;
            overflow-x: auto;
            box-shadow: 1px 2px 6px rgba(0,0,0,0.15);
            display: none;
            color: #222;
        }
        #cgv-community-edges .cgv-community-edges-header {
            font-weight: 600;
            padding-bottom: 4px;
            border-bottom: 1px solid #dddddd;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #cgv-community-edges .cgv-community-edges-toggle {
            cursor: pointer;
            color: #888;
            font-weight: normal;
            padding: 0 4px;
            user-select: none;
        }
        #cgv-community-edges .cgv-community-edges-toggle:hover {
            color: #333;
        }
        #cgv-community-edges .cgv-community-edges-empty {
            color: #999;
            font-style: italic;
            padding: 4px 0;
        }
        #cgv-community-edges table.cgv-community-edges-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        #cgv-community-edges table.cgv-community-edges-table th {
            background: #f4f4f4;
            text-align: left;
            padding: 4px 6px;
            border-bottom: 1px solid #cccccc;
            font-weight: 600;
        }
        #cgv-community-edges table.cgv-community-edges-table td {
            padding: 3px 6px;
            border-bottom: 1px solid #eeeeee;
            word-break: break-word;
        }
        #cgv-community-edges table.cgv-community-edges-table td.cgv-edge-weight {
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        #cgv-community-edges table.cgv-community-edges-table tr.cgv-edge-incoming td {
            background: rgba(255, 248, 220, 0.6);
        }
        #cgv-community-edges table.cgv-community-edges-table tr.cgv-edge-outgoing td {
            background: rgba(255,255,255,0.6);
        }
        #cgv-community-edges table.cgv-community-edges-table tbody tr:hover td {
            background: #fff3cd;
            cursor: pointer;
        }
        #cgv-legend .cgv-legend-header {
            font-weight: 600;
            padding-bottom: 4px;
            border-bottom: 1px solid #dddddd;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        #cgv-legend .cgv-legend-toggle {
            cursor: pointer;
            color: #888;
            font-weight: normal;
            padding: 0 4px;
            user-select: none;
        }
        #cgv-legend .cgv-legend-toggle:hover {
            color: #333;
        }
        #cgv-legend .cgv-legend-body {
            display: block;
        }
        #cgv-legend.cgv-legend-collapsed .cgv-legend-body {
            display: none;
        }
        #cgv-legend .cgv-legend-item {
            display: flex;
            align-items: center;
            padding: 3px 4px;
            cursor: pointer;
            border-radius: 3px;
            user-select: none;
        }
        #cgv-legend .cgv-legend-item:hover {
            background: #f0f0f0;
        }
        #cgv-legend .cgv-legend-item.cgv-legend-active {
            background: #fff3cd;
            font-weight: 600;
        }
        #cgv-legend .cgv-legend-swatch {
            width: 14px;
            height: 14px;
            border: 1px solid #333;
            border-radius: 2px;
            margin-right: 6px;
            flex-shrink: 0;
        }
        #cgv-legend .cgv-legend-label {
            flex: 1;
            word-break: break-word;
        }
        #cgv-legend .cgv-legend-count {
            color: #777;
            font-size: 11px;
            margin-left: 6px;
        }
        #cgv-legend .cgv-legend-empty {
            color: #999;
            font-style: italic;
            padding: 4px 0;
        }
        #cgv-legend .cgv-legend-hint {
            color: #666;
            font-size: 11px;
            padding-top: 4px;
            border-top: 1px solid #eee;
            margin-top: 4px;
        }
        /* ----- Community Aggregation navigation (Back button + label) ----- */
        #cgv-community-nav {
            position: absolute;
            top: 12px;
            left: 12px;
            display: none;
            align-items: center;
            gap: 8px;
            z-index: 5000;
            font: 12px "Segoe UI", Arial, sans-serif;
        }
        #cgv-community-nav button#cgv-community-back {
            background: rgba(255,255,255,0.96);
            border: 1px solid #4A90E2;
            color: #4A90E2;
            padding: 4px 10px;
            border-radius: 4px;
            font: 600 12px "Segoe UI", Arial, sans-serif;
            cursor: pointer;
            box-shadow: 1px 2px 6px rgba(0,0,0,0.15);
        }
        #cgv-community-nav button#cgv-community-back:hover {
            background: #4A90E2;
            color: #ffffff;
        }
        #cgv-community-nav #cgv-community-label {
            background: rgba(255,255,255,0.96);
            border: 1px solid #cccccc;
            border-radius: 4px;
            padding: 4px 10px;
            box-shadow: 1px 2px 6px rgba(0,0,0,0.15);
            color: #222;
        }
    </style>
    <!--
      cytoscape + layout-base + cose-base + fcose are concatenated into
      cytoscape-bundle.js to save HTTP round trips on iframe boot
      (~250 ms per request on a fresh session) and to avoid race conditions
      where the fcose UMD tries to find window.coseBase before cose-base.js
      loads. cola and WebCola are loaded separately below because cola
      re-uses WebCola as a global — they must load in order: cola.js
      (provides window.cola) BEFORE cytoscape-cola.js (registers the layout
      with cytoscape when both window.cytoscape and window.cola exist).
    -->
    <script src="/cytoscape/cytoscape-bundle.js"></script>
    <script src="/cytoscape/cola.js"></script>
    <script src="/cytoscape/cytoscape-cola.js"></script>
</head>
<body>
<div id="cy"></div>
<div id="error"></div>
<div id="cgv-context-menu"></div>
<div id="cgv-community-nav">
    <button id="cgv-community-back" type="button" title="Back to aggregated community view">&larr; Back to Communities</button>
    <span id="cgv-community-label"></span>
</div>
<div id="cgv-side-panel">
    <div id="cgv-legend" aria-label="Color legend">
        <div class="cgv-legend-header">
            <span>Legend</span>
            <span class="cgv-legend-toggle" title="Hide legend">&#x2212;</span>
        </div>
        <div class="cgv-legend-body"></div>
        <div class="cgv-legend-hint" style="display:none"></div>
    </div>
    <div id="cgv-edges" aria-label="Cluster edges">
        <div class="cgv-edges-header">
            <span>Edges</span>
            <span class="cgv-edges-toggle" title="Hide edges">&#x2212;</span>
        </div>
        <div class="cgv-edges-body"></div>
        <div class="cgv-edges-empty" style="display:none"></div>
    </div>
    <div id="cgv-community-edges" aria-label="Community node edges">
        <div class="cgv-community-edges-header">
            <span>Edges</span>
            <span class="cgv-community-edges-toggle" title="Hide edges">&#x2212;</span>
        </div>
        <div class="cgv-community-edges-body"></div>
        <div class="cgv-community-edges-empty" style="display:none"></div>
    </div>
</div>

<script src="/cytoscape/cytoscape-viewer.js"></script>
</body>
</html>
