<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Cytoscape Graph Viewer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #ffffff;
        }
        #cy {
            width: 100%;
            height: 100%;
            display: block;
        }
        #error {
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            padding: 8px 12px;
            background-color: #ffe6e6;
            border: 1px solid #c0392b;
            color: #c0392b;
            font-size: 13px;
            border-radius: 4px;
            display: none;
            z-index: 1000;
        }
        #cgv-context-menu {
            position: absolute;
            background: #ffffff;
            border: 1px solid #cccccc;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
            border-radius: 4px;
            padding: 4px 0;
            font-size: 13px;
            display: none;
            z-index: 2000;
            min-width: 160px;
        }
        #cgv-context-menu .cgv-menu-item {
            padding: 4px 12px;
            cursor: pointer;
        }
        #cgv-context-menu .cgv-menu-item:hover {
            background: #f0f0f0;
        }
        #cgv-context-menu .cgv-menu-separator {
            border-top: 1px solid #dddddd;
            margin: 4px 0;
        }
    </style>
    <!--
      cytoscape + layout-base + cose-base + fcose are concatenated into
      cytoscape-bundle.js to save HTTP round trips on iframe boot
      (~250 ms per request on a fresh session) and to avoid race conditions
      where the fcose UMD tries to find window.coseBase before cose-base.js
      loads. cola and WebCola are loaded separately below because cola
      re-uses WebCola as a global — they must load in order: cola.js
      (provides window.cola) BEFORE cytoscape-cola.js (registers the layout
      with cytoscape when both window.cytoscape and window.cola exist).
    -->
    <script src="/cytoscape/cytoscape-bundle.js"></script>
    <script src="/cytoscape/cola.js"></script>
    <script src="/cytoscape/cytoscape-cola.js"></script>
</head>
<body>
<div id="cy"></div>
<div id="error"></div>
<div id="cgv-context-menu"></div>

<script src="/cytoscape/cytoscape-viewer.js"></script>
</body>
</html>
