server:
  port: 8085
  # Compress REST responses (notably the sigma engine's /api/sigma/nodes
  # + /api/sigma/edges endpoints, which deliver large graph payloads).
  # The 151-node / 1010-edge sample CSV serialises to ~30 KB JSON; with
  # GZIP this compresses to ~5 KB — important for large-graph UX where
  # the same payload may be re-fetched across layout changes via
  # If-None-Match / 304 round-trips.
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: cytoscape-graph-viewer

cytoscape-graph:
  viewer:
    base-url: /cytoscape
    default-csp: "script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'"

# Set to false to disable the RAP servlet registration (useful for running
# just the REST + static-asset layer on Jetty 12, where RAP 4.4 startup
# fails). With rap.enabled=false, GET /api/sample-graph and the static
# assets in /cytoscape/, /vis-network/, /vis-graph/, /cytoscape-viewer.html
# remain reachable; only the RAP entry point /graph is disabled.
rap:
  enabled: true
